name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも実行できるようにしておく
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続で push したとき、古いデプロイを待たずに最新だけを反映する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: テスト
        run: npx vitest run

      - name: ビルド（静的書き出し）
        # リポジトリ名から basePath を自動で決める。リポジトリ名を変えても直さなくてよい
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
